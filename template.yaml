AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kittens Setlist — API + DynamoDB tables

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Architectures: [arm64]
    Environment:
      Variables:
        SONGS_TABLE: !Ref SongsTable
        SETLISTS_TABLE: !Ref SetlistsTable
        MUSICIANS_TABLE: !Ref MusiciansTable
        USERS_TABLE: !Ref UsersTable
        SESSIONS_TABLE: !Ref SessionsTable
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        SUPERADMIN_TELEGRAM_ID: !Ref SuperadminTelegramId

Parameters:
  StageName:
    Type: String
    Default: prod
  TelegramBotToken:
    Type: String
    NoEcho: true
    Description: Telegram bot token from BotFather
  SuperadminTelegramId:
    Type: String
    Description: Telegram user ID of the superadmin

Resources:

  # ─── API ──────────────────────────────────────────────────────────────────────

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: dist/index.handler
      ReservedConcurrentExecutions: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SetlistsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MusiciansTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: ANY
            Path: /{proxy+}
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - src/index.ts

  # ─── DynamoDB Tables ──────────────────────────────────────────────────────────

  SongsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: kittens-songs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  SetlistsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: kittens-setlists
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  MusiciansTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: kittens-musicians
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: kittens-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: telegramId
          AttributeType: S
      KeySchema:
        - AttributeName: telegramId
          KeyType: HASH

  SessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: kittens-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Frontend (S3 + CloudFront) is managed outside this template.
  # Bucket: kittens-setlist-frontend-540966180378
  # Distribution: E3D2LL7A33NW5T  (duw1m60ftrw00.cloudfront.net, kittens.band)
  # OAC: E2YJDR89JNCOPU (kittens-setlist-oac)
  # Deploy workflow: .github/workflows/deploy-frontend.yml


Outputs:
  ApiUrl:
    Description: API Gateway invoke URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'
