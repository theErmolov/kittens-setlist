AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kittens Setlist — API + DynamoDB tables

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Architectures: [arm64]
    Environment:
      Variables:
        SONGS_TABLE: !Ref SongsTable
        SETLISTS_TABLE: !Ref SetlistsTable
        MUSICIANS_TABLE: !Ref MusiciansTable

Parameters:
  StageName:
    Type: String
    Default: prod

Resources:

  # ─── API ──────────────────────────────────────────────────────────────────────

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: dist/index.handler
      ReservedConcurrentExecutions: 3
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SetlistsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MusiciansTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: ANY
            Path: /{proxy+}
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - src/index.ts

  # ─── DynamoDB Tables ──────────────────────────────────────────────────────────

  SongsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: kittens-songs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  SetlistsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: kittens-setlists
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  MusiciansTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: kittens-musicians
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # Frontend (S3 + CloudFront) — pending AWS account CloudFront verification.
  # Open a support case at https://console.aws.amazon.com/support/home
  # Subject: "Enable CloudFront for new account"

Outputs:
  ApiUrl:
    Description: API Gateway invoke URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'
