name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: [src/**, static/**, svelte.config.js, package.json, package-lock.json]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /kittens-setlist
          PUBLIC_API_URL: https://bw1e6cey18.execute-api.eu-central-1.amazonaws.com/prod
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deploy
        uses: actions/deploy-pages@v4
